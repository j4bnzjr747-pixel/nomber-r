<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проверка номера</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
      margin: 0;
    }
    h1 { font-size: 22px; text-align: center; }
    input {
      width: 100%; padding: 14px; font-size: 18px;
      border-radius: 10px; border: 1px solid #334155;
      background: #1e293b; color: #fff;
      box-sizing: border-box; margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    input:focus { outline: none; border-color: #3b82f6; }
    #checkBtn {
      width: 100%; padding: 14px; font-size: 17px;
      border-radius: 10px; border: none;
      background: #3b82f6; color: #fff; font-weight: 600;
    }
    #checkBtn:active { background: #2563eb; }
    #result {
      margin-top: 20px; padding: 14px;
      background: #1e293b; border-radius: 10px;
      font-size: 15px; white-space: pre-wrap;
      word-break: break-word; min-height: 60px;
      line-height: 1.6;
    }
    .ok   { color: #4ade80; }
    .warn { color: #fbbf24; }
    .err  { color: #f87171; }
    .label { color: #94a3b8; }

    .actions {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .actions button {
      padding: 12px 8px; font-size: 14px; font-weight: 500;
      background: #334155; color: #fff; border: none;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      gap: 6px;
    }
    .actions button:active { background: #475569; }
    .actions .wa       { background: #25D366; }
    .actions .wa:active { background: #1da851; }
    .actions .tg       { background: #229ED9; }
    .actions .tg:active { background: #1a7dab; }
    .actions .call     { background: #16a34a; }
    .actions .call:active { background: #15803d; }
    .actions .copy     { background: #475569; }

    .note {
      margin-top: 12px;
      padding: 10px;
      background: #1a2536;
      border-left: 3px solid #3b82f6;
      border-radius: 6px;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>📞 Проверка номера</h1>

  <input id="phoneInput" type="tel" placeholder="+7 912 345-67-89" maxlength="18" />
  <button id="checkBtn">Проверить</button>

  <div id="result">Здесь появится результат…</div>

  <script>
    // ============================================================
    // ТАБЛИЦА DEF-КОДОВ РОССИИ
    // ============================================================
    const DEF_CODES = {
      // ---- МТС ----
      '910': { op: 'МТС', reg: 'Москва' },
      '911': { op: 'МТС', reg: 'Санкт-Петербург' },
      '912': { op: 'МТС', reg: 'Урал' },
      '913': { op: 'МТС', reg: 'Сибирь' },
      '914': { op: 'МТС', reg: 'Дальний Восток' },
      '915': { op: 'МТС', reg: 'Поволжье' },
      '916': { op: 'МТС', reg: 'Москва' },
      '917': { op: 'МТС', reg: 'Москва' },
      '918': { op: 'МТС', reg: 'Юг России' },
      '919': { op: 'МТС', reg: 'Центр' },
      '980': { op: 'МТС', reg: 'Москва' },
      '981': { op: 'МТС', reg: 'Санкт-Петербург' },
      '982': { op: 'МТС', reg: 'Урал' },
      '983': { op: 'МТС', reg: 'Сибирь' },
      '984': { op: 'МТС', reg: 'Поволжье' },
      '985': { op: 'МТС', reg: 'Москва' },
      '986': { op: 'МТС', reg: 'Москва' },
      '987': { op: 'МТС', reg: 'Юг России' },
      '988': { op: 'МТС', reg: 'Юг России' },
      '989': { op: 'МТС', reg: 'Юг России' },

      // ---- Билайн ----
      '903': { op: 'Билайн', reg: 'Москва' },
      '905': { op: 'Билайн', reg: 'Москва' },
      '906': { op: 'Билайн', reg: 'Москва' },
      '909': { op: 'Билайн', reg: 'Москва' },
      '960': { op: 'Билайн', reg: 'Москва' },
      '961': { op: 'Билайн', reg: 'Москва' },
      '962': { op: 'Билайн', reg: 'Юг России' },
      '963': { op: 'Билайн', reg: 'Урал' },
      '964': { op: 'Билайн', reg: 'Сибирь' },
      '965': { op: 'Билайн', reg: 'Дальний Восток' },
      '966': { op: 'Билайн', reg: 'Москва' },
      '967': { op: 'Билайн', reg: 'Москва' },
      '968': { op: 'Билайн', reg: 'Москва' },
      '976': { op: 'Билайн', reg: 'Москва' },

      // ---- МегаФон ----
      '920': { op: 'МегаФон', reg: 'Москва' },
      '921': { op: 'МегаФон', reg: 'Санкт-Петербург' },
      '922': { op: 'МегаФон', reg: 'Урал' },
      '923': { op: 'МегаФон', reg: 'Сибирь' },
      '924': { op: 'МегаФон', reg: 'Дальний Восток' },
      '925': { op: 'МегаФон', reg: 'Москва' },
      '926': { op: 'МегаФон', reg: 'Москва' },
      '927': { op: 'МегаФон', reg: 'Поволжье' },
      '928': { op: 'МегаФон', reg: 'Юг России' },
      '929': { op: 'МегаФон', reg: 'Москва' },
      '930': { op: 'МегаФон', reg: 'Москва' },
      '931': { op: 'МегаФон', reg: 'Санкт-Петербург' },
      '932': { op: 'МегаФон', reg: 'Урал' },
      '933': { op: 'МегаФон', reg: 'Сибирь' },
      '934': { op: 'МегаФон', reg: 'Дальний Восток' },
      '936': { op: 'МегаФон', reg: 'Москва' },
      '937': { op: 'МегаФон', reg: 'Поволжье' },
      '938': { op: 'МегаФон', reg: 'Юг России' },
      '939': { op: 'МегаФон', reg: 'Москва' },

      // ---- Tele2 / СберМобайл ----
      '900': { op: 'Tele2 / СберМобайл', reg: 'Москва' },
      '901': { op: 'Tele2', reg: 'Москва' },
      '904': { op: 'Tele2', reg: 'Москва' },
      '908': { op: 'Tele2', reg: 'Москва' },
      '950': { op: 'Tele2', reg: 'Москва' },
      '951': { op: 'Tele2', reg: 'Москва' },
      '952': { op: 'Tele2', reg: 'Санкт-Петербург' },
      '953': { op: 'Tele2', reg: 'Санкт-Петербург' },
      '958': { op: 'Tele2 / СберМобайл', reg: 'Москва' },
      '977': { op: 'Tele2', reg: 'Москва' },
      '991': { op: 'Tele2', reg: 'Москва' },
      '992': { op: 'Tele2', reg: 'Урал' },
      '993': { op: 'Tele2', reg: 'Сибирь' },
      '994': { op: 'Tele2', reg: 'Дальний Восток' },
      '995': { op: 'Tele2', reg: 'Юг России' },
      '996': { op: 'Tele2', reg: 'Поволжье' },
      '997': { op: 'Tele2', reg: 'Москва' },
      '999': { op: 'Tele2', reg: 'Москва' }
    };

    // ============================================================
    // УТИЛИТЫ
    // ============================================================
    function normalizePhone(input) {
      let s = input.replace(/[^\d+]/g, '');
      if (s.length === 11 && s[0] === '8') s = '+7' + s.slice(1);
      else if (s.length === 11 && s[0] === '7') s = '+' + s;
      else if (s.length === 10) s = '+7' + s;
      return s;
    }

    function formatPhone(digits) {
      const d = digits.slice(1);
      let out = '+7';
      if (d.length > 0) out += ' ' + d.slice(0, 3);
      if (d.length > 3) out += ' ' + d.slice(3, 6);
      if (d.length > 6) out += '-' + d.slice(6, 8);
      if (d.length > 8) out += '-' + d.slice(8, 10);
      return out;
    }

    function applyMask(value) {
      let digits = value.replace(/\D/g, '');
      if (digits.startsWith('8')) digits = '7' + digits.slice(1);
      else if (!digits.startsWith('7')) digits = '7' + digits;
      digits = digits.slice(0, 11);
      return formatPhone(digits);
    }

    function copyText(text, label) {
      const done = () => alert('📋 ' + label + ':\n' + text);
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }

    function fallbackCopy(text, done) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { alert('Не удалось скопировать: ' + text); }
      document.body.removeChild(ta);
    }

    // ============================================================
    // ПРОВЕРКА
    // ============================================================
    function checkPhone() {
      const raw = document.getElementById('phoneInput').value.trim();
      const box = document.getElementById('result');

      if (!raw) {
        box.innerHTML = '<span class="warn">⚠️ Введи номер</span>';
        return;
      }

      const normalized = normalizePhone(raw);
      const digits = normalized.replace(/\D/g, '');

      const lines = [];

      if (!digits.startsWith('7') || digits.length !== 11) {
        lines.push(`<span class="err">❌ Не похоже на российский номер</span>`);
        lines.push(`<span class="label">Введено: ${raw}</span>`);
        box.innerHTML = lines.join('<br>');
        return;
      }

      const intl = formatPhone(digits);
      const natl = '8 ' + digits.slice(1,4) + ' ' + digits.slice(4,7) + '-' + digits.slice(7,9) + '-' + digits.slice(9,11);

      lines.push(`<b>Введено:</b> ${raw}`);
      lines.push(`<b>Страна:</b> Россия 🇷🇺`);
      lines.push(`<b>Код страны:</b> +7`);
      lines.push(`<b>Международный:</b> ${intl}`);
      lines.push(`<b>Национальный:</b> ${natl}`);
      lines.push('');

      const def = digits.slice(1, 4);
      const info = DEF_CODES[def];

      lines.push(`<b>DEF-код:</b> ${def}`);

      if (info) {
        lines.push(`<span class="ok"><b>Оператор:</b> ${info.op}</span>`);
        lines.push(`<span class="ok"><b>Регион:</b> ${info.reg}</span>`);
        lines.push(`<b>Тип:</b> 📱 мобильный`);
      } else if (def[0] === '9') {
        lines.push(`<span class="warn"><b>Оператор:</b> неизвестен (код ${def})</span>`);
        lines.push(`<b>Тип:</b> 📱 мобильный (префикс 9xx)`);
      } else {
        lines.push(`<span class="warn"><b>Оператор:</b> не определён</span>`);
        lines.push(`<b>Тип:</b> ☎️ возможно, стационарный`);
      }

      const e164 = '+' + digits;
      const waLink = 'https://wa.me/' + digits;
      const tgLink = 'https://t.me/' + e164;

      const actionsHTML = `
        <div class="actions">
          <button class="call" onclick="tryOpen('tel:${e164}')">📞 Позвонить</button>
          <button class="wa"   onclick="tryOpen('${waLink}')">💬 WhatsApp</button>
          <button class="tg"   onclick="tryOpen('${tgLink}')">✈️ Telegram</button>
          <button class="copy" onclick="copyText('${e164}','Номер')">📋 Копировать</button>
        </div>

        <div class="note">
          ⚠️ В превью Koder кнопки приложений <b>не откроют WhatsApp/Telegram</b> —
          встроенный браузер не умеет передавать ссылки в приложения.
          <br><br>
          <b>Чтобы проверить сейчас:</b> скопируй ссылку и вставь её в Safari.
          <br>
          <button class="copy" style="width:100%;margin-top:8px;padding:10px;border:none;border-radius:8px;color:#fff;font-size:14px;background:#475569" onclick="copyText('${waLink}','WhatsApp ссылка')">📋 Скопировать ссылку WhatsApp</button>
          <button class="copy" style="width:100%;margin-top:8px;padding:10px;border:none;border-radius:8px;color:#fff;font-size:14px;background:#475569" onclick="copyText('${tgLink}','Telegram ссылка')">📋 Скопировать ссылку Telegram</button>
          <br>
          После переноса на хостинг эти кнопки будут работать напрямую. 🚀
        </div>
      `;

      box.innerHTML = lines.join('<br>') + actionsHTML;
    }

    // Пытаемся открыть ссылку. Если Koder блокирует — сообщаем пользователю.
    function tryOpen(url) {
      try {
        window.location.href = url;
        // Если через 1.5 сек ничего не произошло — подсказываем
        setTimeout(() => {
          // Никак не проверим точно, но дадим совет
        }, 1500);
      } catch (e) {
        alert('Koder не поддерживает открытие внешних приложений.\nСкопируй ссылку и вставь её в Safari.');
      }
    }

    // ============================================================
    // СОБЫТИЯ
    // ============================================================
    document.getElementById('checkBtn').addEventListener('click', checkPhone);

    const input = document.getElementById('phoneInput');
    input.addEventListener('input', function () {
      const cur = this.value;
      if (cur.replace(/\D/g, '').length === 0) return;
      this.value = applyMask(cur);
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') checkPhone();
    });
  </script>
</body>
</html>
